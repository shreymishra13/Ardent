<!-- book image carousel -->
        <div id="carouselExampleControls" class="carousel slide  text-center" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img class="w-25 h-25" src="/images/book-1.png" alt="First slide">
                    <img class="w-25 h-25" src="/images/book-4.png" alt="First slide">
                    <img class="w-25 h-25" src="/images/book-5.png" alt="First slide">
                </div>
                <div class="carousel-item">
                    <img class=" w-25 h-25" src="/images/book-2.png" alt="Second slide">
                    <img class=" w-25 h-25" src="/images/book-6.png" alt="Second slide">
                    <img class=" w-25 h-25" src="/images/book-7.png" alt="Second slide">
                </div>
                <div class="carousel-item">
                    <img class=" w-25 h-25" src="/images/book-3.png" alt="Third slide">
                    <img class=" w-25 h-25" src="/images/book-8.png" alt="Third slide">
                    <img class=" w-25 h-25" src="/images/book-9.png" alt="Third slide">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">

            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
