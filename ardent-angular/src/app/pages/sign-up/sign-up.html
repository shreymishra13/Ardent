 <section style="background-color: #eee;" class="py-5">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-lg-12 col-xl-11">
          <div class="card text-black" style="border-radius: 25px;">
            <div class="card-body p-md-5">
              <div class="row justify-content-center">
                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
                  <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Sign up</p>
                  
                          <form class="mx-1 mx-md-4" action="/signup" method="post">
                            <div class="d-flex flex-row align-items-center mb-4">
                              <div class="form-outline flex-fill mb-0">
                                <input type="text" id="form3Example1c" class="form-control" name="name" />
                                <label class="form-label" for="form3Example1c">Your Name</label>
                              </div>
                            </div>
                            <div class="d-flex flex-row align-items-center mb-4">
                              <div class="form-outline flex-fill mb-0">
                                <input type="email" class="form-control" name="email" />
                                <label class="form-label" for="form3Example3c">Your Email</label>
                              </div>
                            </div>
                            <div class="d-flex flex-row align-items-center mb-4">
                              <div class="form-outline flex-fill mb-0">
                                <input type="password" class="form-control" name="password" id="password" />
                                <label class="form-label" for="form3Example4c">Password</label>
                              </div>
                            </div>
                            <div class="d-flex flex-row align-items-center mb-4">
                              <div class="form-outline flex-fill mb-0">
                                <input type="password" class="form-control" name="confirmationPassword"
                                  id="confirmation-password" />
                                <label class="form-label" for="form3Example4c">Confirm Password</label>
                              </div>
                            </div>
                            <p id="password-status"></p>
                            <div class="d-flex flex-row align-items-center mb-4">
                              <div class="form-outline flex-fill mb-0">
                                <input type="text" class="form-control" name="address" />
                                <label class="form-label" for="form3Example4c">Address</label>
                      </div>
                    </div>
                    <div class=" d-flex flex-row align-items-center mb-4">
                                  <div class="form-outline flex-fill mb-0">
                                    <input type="number" class="form-control" name="pincode" />
                                    <label class="form-label" for="form3Example4c">Pincode</label>
                      </div>
                    </div>
                    <div class=" d-flex flex-row align-items-center mb-4">
                                      <div class="form-outline flex-fill mb-0">
                                        <input type="text" class="form-control" name="mobileNo" />
                                        <label class="form-label" for="form3Example4c">Contact</label>
                                      </div>
                                  </div>
                                  <div class=" d-flex flex-row align-items-center mb-4">
                                    <div class="form-outline flex-fill mb-0">
                                      <label for="accounttype">Choose account type:</label>
                                      <select name="accountType" class="form-control">
                                        <option value="" disabled selected>-- Select Role --</option>
                                        <option value={{role.code}} *ngFor="let role of roles">{{role.displayName}}</option>
                                      
                                      </select>
                                    </div>
                                  </div>
                                  <button type="submit" class="btn btn-dark btn-block btn-lg">Register</button>
                                  <br>
                                  <a href="login"><button type="button"
                                      class="btn btn-outline-dark btn-block btn-lg">Sign In</button></a>
                          </form>
                </div>
                <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
                  <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                    class="img-fluid" alt="Sample image">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
