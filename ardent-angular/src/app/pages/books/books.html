<div class="container my-5">
    <div class="row">

        <div class="col-4 my-5" *ngFor="let book of books">
            <div class="card " style="width: 18rem;">
                <img class="card-img-top" src={{book.imgUrl}} alt="Card image cap">
                <div class="card-body">
                    <h5 class="card-title">{{book.bookName}}</h5>
                    <h6 class="card-title">{{book.authorName}}</h6>
                    <h6 class="card-title">{{book.genre}}</h6>
                    <h6 class="card-title">{{book.bookName}}</h6>
                    <p class="card-text">{{book.description}}</p>
                    <h5 class="card-title">{{book.price}}</h5>
                    <a href="#" class="btn btn-primary">Go somewhere</a>
                </div>
            </div>

        </div>
    </div>
</div>
