<div class="container my-5 border border-secondary p-5 rounded">


    <form>
        <h1 class="text-center">Contact Us</h1>
        <div class="form-group my-3">
            <label for="name">Name</label>
            <input type="text" class="form-control" placeholder="Enter your name here">

        </div>
        <div class="form-group my-3">
            <label for="email">Email</label>
            <input type="email" class="form-control"  placeholder="Enter your email here">

        </div>
        <div class="form-group my-3">
            <label for="contact">Contact</label>
            <input type="number" class="form-control" placeholder="Enter your contact here">

        </div>
        <div class="form-group my-3">
            <label for="message">Message</label>
           <textarea name="message" class="form-control" cols="30" rows="10" maxlength="200" placeholder="I want to contact you because..." ></textarea>

        </div>


        <div class="mb-2">

            <small id="emailHelp" class="form-text text-muted">We'll never share your details with anyone else.</small>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
